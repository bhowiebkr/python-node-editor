# Run the checks on each push to master and on each pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }} ${{ matrix.pyside }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          # The oldest versions that requirements.txt allows.
          - { os: ubuntu-latest, python: "3.10", pyside: "PySide6==6.5.*" }
    env:
      QT_QPA_PLATFORM: offscreen # Run Qt without a screen.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the libraries that Qt needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - if: matrix.pyside
        run: pip install "${{ matrix.pyside }}"
      - run: pytest
