# Settings for the development tools (ruff, mypy and pytest).
# To run the app, you need only requirements.txt.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # PEP 8 names
    "UP",  # modern Python syntax
    "B",   # likely bugs
    "SIM", # simpler code
]

[tool.ruff.lint.pep8-naming]
# Qt calls these methods by name, so they must keep the Qt (camelCase) names.
extend-ignore-names = ["*Event", "boundingRect", "drawBackground", "itemChange", "mimeData", "mimeTypes"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["main.py", "node_editor", "example_project", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # So that the tests can import node_editor.
qt_api = "pyside6"
